version: '3.8'

services:
  sosmed-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sosmed
    restart: unless-stopped
    ports:
      - "3003:3000"
      - "4003:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - wheza

networks:
  wheza:
    external: true
